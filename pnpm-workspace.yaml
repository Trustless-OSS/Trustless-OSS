overrides:
  axios: ">=1.18.0"
  brace-expansion: ">=5.0.8"
  protobufjs: ">=7.6.3"
  postcss: ">=8.5.10"
  sharp: ">=0.35.4"
  uuid: ">=11.1.1"
  ws: ">=8.21.0"
  undici: ">=8.12.2"
  toml: "^5.0.1"

# zod <4.6.6 (GHSA-mrhx-c7xc-m3w5): false positive — abitype declares zod as an
# optional peer with range ^3 || ^4, but the tree only ever resolves zod 3.x,
# which is outside the vulnerable 4.x range. No vulnerable code is installed.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5

allowBuilds:
  '@reown/appkit': true
  '@stellar/stellar-sdk': true
  blake-hash: true
  bufferutil: true
  protobufjs: true
  secp256k1: true
  sharp: true
  tiny-secp256k1: true
  unrs-resolver: true
  usb: true
  utf-8-validate: true
